services:
  node_js:
    image: node:25
    ports:
      - 5001:5001 # liveserver
      - 5174:5174 # vite
      - 3001:3001 # API
    volumes:
      - ./code:/app
    tty: true
    working_dir: /app
    restart: always

  mysql: 
    image:  mysql:9.5
    ports:
      - 3306:3306
    volumes:
      - ./code/mysql:/app
      - ./mysql-data:/var/lib/mysql
    working_dir: /app 
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root